name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version

          RAW_VERSION="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            REST="${RAW_VERSION#1.}"
            MAJOR_VERSION="${REST%%.*}"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%[^0-9]*}"

          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or higher is required, but detected version: $RAW_VERSION"
            exit 1
          fi
          echo "Verified Java major version: $MAJOR_VERSION"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./debug.keystore ]; then
            echo "Using existing ./debug.keystore"
          else
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
            if [ ! -f ./debug.keystore ]; then
              echo "::error::Failed to create temporary ./debug.keystore"
              exit 1
            fi
            echo "Created temporary ./debug.keystore"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -e "$APK_PATH" ] && [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ] && [[ "$APK_PATH" == *.apk ]]; then
            echo "Verified APK at $APK_PATH ($(wc -c < "$APK_PATH") bytes)"
          else
            echo "::error::Expected non-empty APK file not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_DIR}/app-debug.apk"
          echo "asset_path=${TEMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]] || [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset must be named app-debug.apk, got: $ASSET_PATH"
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES="$(printf '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- Run Number: ${GITHUB_RUN_NUMBER}" \
            "- Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "- Intended Use: For testing only (not a Play Store production release)" \
            "- Signing: Signed only with a temporary debug keystore")"

          gh release create "$TAG" "${ASSET_PATH}#app-debug.apk" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.publish_release.outcome }}
          TAG: ${{ steps.publish_release.outputs.tag }}
          TITLE: ${{ steps.publish_release.outputs.title }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_OUTCOME:-}" = "success" ]; then
            RELEASE_URL="$(gh release view "$TAG" --json url --jq '.url')"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- **Release Tag:** $TAG"
              echo "- **Release Title:** $TITLE"
              echo "- **Release URL:** $RELEASE_URL"
              echo "- **Asset:** app-debug.apk"
              echo "- **Backup Artifact:** \`app-debug-apk\` remains available in the workflow run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or did not complete."
            echo "APK verification outcome: ${VERIFY_OUTCOME:-unknown}"
            echo "Do NOT assume the newly built APK is available at the latest release download URL."
            echo "If the APK build and artifact upload succeeded, download the backup artifact named app-debug-apk from this workflow run."
            {
              echo "## Release Publishing Failed"
              echo ""
              echo "- **APK Verification Outcome:** ${VERIFY_OUTCOME:-unknown}"
              echo "- **Release Publishing Outcome:** ${UPLOAD_OUTCOME:-unknown}"
              echo "- Do not assume the latest release download link points to this run's APK."
              echo "- Check whether the \`app-debug-apk\` backup artifact is available in this workflow run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
